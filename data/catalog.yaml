# Catalog: каждая позиция содержит display-имя, фиксированную наценку (markup, руб.)
# и db_sku — ключ в prices.db (из Telegram-канала/бота).
# Итоговая цена для покупателя: db_price + markup.
# Для iPhone: db_sku_esim / db_sku_nano / db_sku_activ — три варианта с разными ценами.
# Если SKU не указан или цена в БД отсутствует — вариант не показывается.

