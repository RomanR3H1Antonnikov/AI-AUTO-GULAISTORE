store:
  name: Gulai Store
  location: ТЦ «Горбушка»
  address: ул. Барклая 8, полуторный этаж (между 1 и 2), магазин №508
  metro: м. Багратионовская (5 минут пешком)
  hours: "Чат работает 24/7, магазин — уточняйте актуальное расписание"
  rating: "4.9"
  reviews_count: "более 350"

facts:
  - Продаём только НОВЫЕ устройства — не восстановленные, не активированные, с заводскими пломбами
  - Гарантия 12 месяцев + кассовый чек и все документы
  - Проверяем устройство вместе с покупателем перед оплатой — без спешки
  - Техника ввезена по параллельному импорту (как у большинства продавцов этой категории)
  - Параллельный импорт = новая техника с нашей гарантией 12 мес. и кассовым чеком. Говорить об этом прямо и спокойно
  - Цена в объявлении — при оплате НАЛИЧНЫМИ
  - Карта / СБП / безнал для юрлиц — плюс 13% к цене (упоминать ТОЛЬКО если клиент спрашивает про безнал)
  - Доставка по Москве — курьером в день заказа, от 500 ₽ (доставка оплачивается сразу, остаток за товар — при получении)
  - Доставка по России — СДЭК после полной предоплаты
  - Перед выездом в магазин — обязательно бронировать устройство (бронирует менеджер, не бот)
  - Клавиатура MacBook — ТОЛЬКО английская (латинская) раскладка, русских символов НА КЛАВИШАХ НЕТ. Никогда не говорить, что есть русская клавиатура
  - Лазерная гравировка русской раскладки — 1 000 ₽. Предлагать её сразу, когда клиент спрашивает про русскую клавиатуру / русские символы
